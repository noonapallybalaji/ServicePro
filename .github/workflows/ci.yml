# PLAN.md §15.3 — every PR: build, lint, tests (incl. real PostgreSQL), contract drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/api/global.json
      - uses: actions/cache@v4
        with:
          path: .cache/nuget/packages
          key: nuget-${{ hashFiles('apps/api/Directory.Packages.props') }}
      - name: Restore
        run: dotnet restore ServicePro.slnx
      - name: Build (warnings are errors; regenerates the OpenAPI contract)
        run: dotnet build ServicePro.slnx -c Release --no-restore
      - name: OpenAPI contract is committed
        run: git diff --exit-code -- openapi/servicepro.json
      - name: Unit tests
        run: dotnet test --project tests/ServicePro.UnitTests -c Release --no-build
      - name: Architecture tests
        run: dotnet test --project tests/ServicePro.ArchitectureTests -c Release --no-build
      - name: Integration tests (Testcontainers PostgreSQL)
        run: dotnet test --project tests/ServicePro.IntegrationTests -c Release --no-build
      - name: Migrations are up to date with the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/ServicePro.Infrastructure --startup-project src/ServicePro.Infrastructure --no-build --configuration Release

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API client matches the contract
        run: |
          pnpm --filter @servicepro/api-client generate
          git diff --exit-code -- packages/api-client/src/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
